    <script>
        // Ensure the event listener is added after the page loads
        window.addEventListener('load', function () {
          // Attach the event listener to the images inside .notyrusBox
          document.querySelectorAll('img').forEach(function (img) {
            img.addEventListener('mouseover', function () {
                document.getElementById('gameOver').checked = true;
                document.getElementById('startGame').checked = false;
            });
          });
        });
        function resetGame() {
          // Uncheck the gameOver checkbox to reset the game state
          document.getElementById('gameOver').checked = false;
        }
        window.onload = function() {
            document.getElementById('gameOver').checked = false;
            document.getElementById('startGame').checked = false;
        };
      </script>
