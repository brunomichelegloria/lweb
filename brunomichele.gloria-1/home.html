<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<head>
    <title>Notyrus</title>
	<link rel="stylesheet" href="layout.css" type="text/css" />
	<link rel="stylesheet" href="animationsNoty.css" type="text/css" />
    <link rel="stylesheet" href="animationsBones.css" type="text/css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        #noty1{
            animation:notyrusSpawn 4s linear forwards,
                    notyrusScrollT-RL 2s 4.5s linear forwards,
                    notyrusScrollB-LR 2s 6.5s linear forwards,
                    notyrusScrollB-RL 2s 8.5s linear forwards;
        }
        #noty2{
            animation:notyrusSpawn 4s linear forwards,
                    notyrusScrollR-BT 2s 6.5s linear forwards,
                    notyrusScrollR-TB 2s 8.5s linear forwards;
        }
        #noty3{
            animation:notyrusSpawn 4s linear forwards,
                    notyrusScrollT-RL 2s 6.5s linear forwards,
                    notyrusScrollT-LR 2s 8.5s linear forwards;
        }
        #noty4{
            animation:notyrusSpawn 4s linear forwards,
                    notyrusScrollL-TB 2s 6.5s linear forwards,
                    notyrusScrollL-BT 2s 8.5s linear forwards;
        }
    </style>
</head>

<body>
    <audio autoplay>
		<source src="./music/Spider_Dance.mp3" />
		Not
	</audio>
    <div class="notyrusBox">
        <img class="notyrus" id="noty1" src="./img/notyrus.svg" />
        <img class="notyrus" id="noty2" src="./img/notyrus.svg" />
        <img class="notyrus" id="noty3" src="./img/notyrus.svg" />
        <img class="notyrus" id="noty4" src="./img/notyrus.svg" />
    </div>
    <div class="boneBox">
        <div class="boneBump">
                <img src="./img/boneBumpT.svg" height="50x" width="20px" />
        </div>
        <div class="boneBody">
                <img src="./img/boneBody.svg" height="50px" width="20px"/>
        </div>
        <div class="boneBump">
                <img src="./img/boneBumpB.svg" height="50px" width="20px"/>
        </div>
    </div>
</body>
</html>
